name: HCS Helm Chart Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  hcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HCS scan
        uses: MabsIPCA/hcs@v0.0.3
        with:
          path: "helm/render-problems"
          # kics-config: ".kics.yaml"
          # trivy-config: "trivy.yaml"
